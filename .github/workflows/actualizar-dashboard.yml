name: Actualizar dashboard

on:
  # Se pide cada 15 min (en minutos de menos demanda), pero GitHub lo ejecuta de forma irregular,
  # a veces con horas entre corridas. Para más frecuencia ver "Disparo cada 5 minutos" en el README.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pruebas
        run: node --test scripts/transform.test.mjs

      - name: Leer Monday
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: node scripts/fetch-monday.mjs

      - id: pages
        uses: actions/configure-pages@v5

      # Si el PDF falla, el tablero se publica igual y su botón abre la versión para imprimir
      - name: Reporte semanal en PDF
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          npm ci --no-audit --no-fund
          node scripts/pdf.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub apaga los cron de repos sin actividad en 60 días; reactivarlo reinicia ese contador.
      - name: Mantener activa la actualización automática
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/actualizar-dashboard.yml/enable" || true
