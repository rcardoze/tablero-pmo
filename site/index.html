<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tablero PMO</title>
  <meta name="description" content="Estado en vivo de todos los tableros de Monday de la PMO." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='18' width='6' height='11' rx='2' fill='%230ca30c'/%3E%3Crect x='13' y='10' width='6' height='19' rx='2' fill='%232a78d6'/%3E%3Crect x='23' y='4' width='6' height='25' rx='2' fill='%23d03b3b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    try {
      const t = localStorage.getItem('pmo-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Tablero PMO</h1>
      <p class="sub" id="coverage">Estado de todos los tableros de Monday</p>
    </div>
    <div class="topbar-right">
      <nav class="tabs" aria-label="Tableros">
        <a href="./" aria-current="page">PMO</a>
        <a href="diques.html">Diques</a>
      </nav>
      <a class="report-btn" id="report-btn" href="reporte.html" title="Reporte de los últimos 7 días en PDF">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 11v6m-3-3 3 3 3-3"/></svg>
        <span>Reporte semanal <span class="report-fmt">PDF</span></span>
      </a>
      <div class="updated" id="updated" aria-live="polite"><span class="live-dot"></span><span>Cargando…</span></div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main id="app" aria-busy="true">
    <p class="loading">Cargando datos de Monday…</p>
  </main>

  <footer class="footer" id="footer"></footer>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
