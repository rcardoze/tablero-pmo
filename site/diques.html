<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diques de la flota</title>
  <meta name="description" content="Estado en vivo de los diques secos de la flota: cronograma, costos, órdenes de compra, imprevistos y programa de próximos diques." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 17h24l-3 7H7z' fill='%232a78d6'/%3E%3Crect x='14' y='6' width='3' height='11' rx='1' fill='%23d03b3b'/%3E%3Crect x='2' y='26' width='28' height='3' rx='1.5' fill='%230ca30c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="diques.css" />
  <script>
    try {
      const t = localStorage.getItem('pmo-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Diques de la flota</h1>
      <p class="sub" id="coverage">Diques secos en curso, realizados y programados</p>
    </div>
    <div class="topbar-right">
      <nav class="tabs" aria-label="Tableros">
        <a href="./">PMO</a>
        <a href="diques.html" aria-current="page">Diques</a>
      </nav>
      <div class="updated" id="updated" aria-live="polite"><span class="live-dot"></span><span>Cargando…</span></div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main id="app" aria-busy="true">
    <p class="loading">Cargando datos de los diques…</p>
  </main>

  <footer class="footer" id="footer"></footer>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <script src="diques.js" defer></script>
</body>
</html>
